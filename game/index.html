<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>寂静工坊</title>
  </head>
  <body>
    <main id="app" aria-label="寂静工坊" data-i18n-aria-label="app.ariaLabel">
      <section id="home-page" class="page home-page" aria-labelledby="home-title">
        <div class="home-content">
          <p class="eyebrow" data-i18n="app.name">寂静工坊</p>
          <h1 id="home-title" data-i18n="app.documentTitle">寂静工坊</h1>
          <p class="home-tagline" data-i18n="home.tagline">一款让古老机器重新运转起来的安静解谜游戏。</p>
          <div class="home-actions">
            <button id="home-start" class="primary-action" type="button" data-i18n="home.start">进入工坊</button>
            <button id="home-settings" class="secondary-action" type="button" data-i18n="home.settings">设置</button>
          </div>
          <p class="home-version" data-i18n="home.version">一台小机器，一双细心的手。</p>
        </div>
        <div class="home-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </section>

      <section id="settings-page" class="page settings-page" aria-labelledby="settings-title" hidden>
        <header class="subpage-header">
          <button id="settings-back" class="text-button" type="button">
            <span aria-hidden="true">←</span> <span id="settings-back-label" data-i18n="settings.backHome">返回主页</span>
          </button>
          <div class="subpage-heading">
            <p class="eyebrow" data-i18n="app.name">寂静工坊</p>
            <h1 id="settings-title" data-i18n="settings.title">设置</h1>
          </div>
        </header>
        <div class="settings-card">
          <p class="settings-subtitle" data-i18n="settings.subtitle">调整工坊，让它更合你的心意。</p>
          <div class="setting-row">
            <div>
              <strong data-i18n="settings.language">语言</strong>
              <span data-i18n="settings.languageDescription">选择整个游戏使用的语言。</span>
            </div>
            <select data-locale-select aria-label="语言" data-i18n-aria-label="language.label">
              <option value="zh-CN" data-i18n="language.chinese">中文</option>
              <option value="en" data-i18n="language.english">English</option>
            </select>
          </div>
        </div>
      </section>

      <section id="game-page" class="page game-page" aria-labelledby="game-title" hidden>
        <button id="game-menu-button" class="game-menu-button" type="button" aria-label="菜单" data-i18n-aria-label="menu.button">
          <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <span data-i18n="menu.button">菜单</span>
        </button>
        <header class="topbar">
          <div>
            <p class="eyebrow" data-i18n="app.name">寂静工坊</p>
            <h1 id="game-title" data-i18n="app.headline">唤醒沉睡的机器。</h1>
          </div>
          <div class="status-pill" id="run-status" data-i18n="app.ready">准备动手</div>
        </header>
        <section class="game-grid">
          <nav id="level-navigation" class="level-navigation" aria-label="关卡" data-i18n-aria-label="levelNav.title">
            <div class="level-nav-heading">
              <p class="eyebrow" data-i18n="levelNav.title">关卡</p>
              <p class="level-nav-subtitle" data-i18n="levelNav.freeSelect">自由选关</p>
            </div>
            <div id="level-list" class="level-list"></div>
            <div class="level-nav-pager">
              <button id="level-previous" class="level-nav-pager-button" type="button" data-i18n="levelNav.previous">← 上一关</button>
              <button id="level-next" class="level-nav-pager-button" type="button" data-i18n="levelNav.next">下一关 →</button>
            </div>
          </nav>
          <div class="world-card">
            <div class="world-meta">
              <span id="level-kicker">工坊 01</span>
              <span id="tick-label">节拍 0</span>
            </div>
            <div id="stage" class="stage" aria-label="工坊世界" data-i18n-aria-label="app.workshopWorld"></div>
            <div id="world-caption" class="world-caption"></div>
          </div>
          <aside id="workbench" class="workbench-card" aria-label="工作台" data-i18n-aria-label="app.workbench"></aside>
        </section>
        <div id="game-menu" class="menu-backdrop" hidden>
          <div class="game-menu" role="dialog" aria-modal="true" aria-labelledby="menu-title">
            <div class="menu-heading">
              <p class="eyebrow" data-i18n="app.name">寂静工坊</p>
              <h2 id="menu-title" data-i18n="menu.title">暂停菜单</h2>
            </div>
            <div class="menu-actions">
              <button id="menu-continue" class="primary-action" type="button" data-i18n="menu.continue">继续游戏</button>
              <button id="menu-settings" class="secondary-action" type="button" data-i18n="menu.settings">设置</button>
              <button id="menu-home" class="text-button menu-home-button" type="button" data-i18n="menu.home">返回主页</button>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
